<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Job Analyzer</title>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --ink: #12181f;
    --muted: #5b6472;
    --border: #d7dce2;
    --accent: #3452d9;
    --accent-ink: #ffffff;
    --good: #1f9d66;
    --good-bg: #e8f6ef;
    --bad: #c8433f;
    --bad-bg: #fbeceb;
    --radius: 6px;
    --mono: ui-monospace, SFMono-Regular, "Roboto Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px;
    line-height: 1.5;
  }

  main {
    width: 100%;
    max-width: 560px;
  }

  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .field { margin-bottom: 20px; }
  .field:last-of-type { margin-bottom: 0; }

  textarea {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fbfcfd;
  }
  textarea:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .dropzone {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    color: var(--muted);
    background: #fbfcfd;
    cursor: pointer;
  }
  .dropzone.has-file { border-style: solid; color: var(--ink); }
  .dropzone input[type="file"] { display: none; }
  .dropzone .filename { font-weight: 600; color: var(--ink); }

  button.primary {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary:not(:disabled):hover { filter: brightness(1.06); }

  button.link {
    border: none;
    background: none;
    color: var(--accent);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  .error-box {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--bad-bg);
    color: var(--bad);
    font-size: 13px;
  }
  .error-box.visible { display: block; }

  /* --- Auth screen --- */
  #auth-screen input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 12px;
    font: inherit;
    font-size: 14px;
    background: #fbfcfd;
  }
  .auth-toggle {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }

  /* --- Results screen --- */
  #results-screen { display: none; }

  .score-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 24px;
  }
  .score-number {
    font-family: var(--mono);
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .score-label {
    color: var(--muted);
    font-size: 14px;
  }

  .skill-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .skill-group h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .skill-list { list-style: none; margin: 0; padding: 0; }
  .skill-list li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 14px;
    padding: 5px 0;
  }
  .mark { font-weight: 700; flex-shrink: 0; }
  .mark.good { color: var(--good); }
  .mark.bad { color: var(--bad); }
  .empty-note { color: var(--muted); font-size: 13px; }

  .recommendations {
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .recommendations h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .recommendations ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .recommendations li { padding: 3px 0; }

  .summary-text {
    margin-top: 20px;
    font-size: 14px;
    color: var(--ink);
    background: #fbfcfd;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }
  .top-bar .account {
    font-size: 13px;
    color: var(--muted);
  }

  .api-base {
    margin-top: 32px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .api-base input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    font: inherit;
    font-size: 12px;
    background: #fbfcfd;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>

  <!-- ===================== AUTH SCREEN ===================== -->
  <section id="auth-screen">
    <h1>AI Job Analyzer</h1>
    <p class="subtitle">Узнайте, насколько ваше резюме подходит вакансии.</p>

    <div class="panel">
      <form id="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input id="auth-email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="auth-password">Пароль</label>
          <input id="auth-password" type="password" required autocomplete="current-password" minlength="8" />
        </div>
        <button type="submit" class="primary" id="auth-submit">Войти</button>
      </form>
      <div class="auth-toggle">
        <span id="auth-toggle-text">Нет аккаунта?</span>
        <button type="button" class="link" id="auth-toggle-btn">Зарегистрироваться</button>
      </div>
      <div class="error-box" id="auth-error"></div>
    </div>

    <div class="api-base">
      <span>API:</span>
      <input id="api-base-input" value="http://localhost:8000" />
    </div>
  </section>

  <!-- ===================== ANALYZER SCREEN ===================== -->
  <section id="analyzer-screen" style="display:none">
    <div class="top-bar">
      <div>
        <h1>AI Job Analyzer</h1>
        <p class="subtitle" style="margin:0">Вставьте вакансию и загрузите резюме.</p>
      </div>
      <div class="account">
        <span id="account-email"></span> · <button class="link" id="logout-btn">Выйти</button>
      </div>
    </div>

    <div class="panel" id="input-panel">
      <div class="field">
        <label for="vacancy-text">Вакансия</label>
        <textarea id="vacancy-text" placeholder="Вставьте текст вакансии: описание, требования..."></textarea>
      </div>

      <div class="field">
        <label>Резюме</label>
        <label class="dropzone" id="dropzone" for="resume-file">
          <span id="dropzone-label">PDF или DOCX — нажмите, чтобы выбрать файл</span>
          <span class="link" style="flex-shrink:0">Загрузить</span>
        </label>
        <input type="file" id="resume-file" accept=".pdf,.docx" />
      </div>

      <button class="primary" id="analyze-btn" disabled>Analyze</button>
      <div class="error-box" id="analyze-error"></div>
    </div>

    <!-- ===================== RESULTS ===================== -->
    <div class="panel" id="results-screen">
      <div class="score-row">
        <span class="score-number" id="score-number">0%</span>
        <span class="score-label">Match</span>
      </div>

      <div class="skill-columns">
        <div class="skill-group">
          <h2>Совпадает</h2>
          <ul class="skill-list" id="matched-list"></ul>
        </div>
        <div class="skill-group">
          <h2>Не хватает</h2>
          <ul class="skill-list" id="missing-list"></ul>
        </div>
      </div>

      <div class="recommendations">
        <h2>Рекомендации</h2>
        <ul id="recommendations-list"></ul>
      </div>

      <div class="summary-text" id="summary-text"></div>

      <button class="primary" id="reset-btn" style="background:transparent;color:var(--accent);border:1px solid var(--border)">
        Новый анализ
      </button>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  // Токен и id резюме живут только в памяти вкладки — не в localStorage.
  let apiBase = document.getElementById("api-base-input").value.replace(/\/$/, "");
  let accessToken = null;
  let userEmail = null;
  let uploadedResumeId = null;
  let isRegisterMode = false;

  const $ = (id) => document.getElementById(id);

  function apiUrl(path) {
    apiBase = $("api-base-input").value.replace(/\/$/, "");
    return apiBase + path;
  }

  function showError(el, message) {
    el.textContent = message;
    el.classList.add("visible");
  }
  function hideError(el) {
    el.classList.remove("visible");
    el.textContent = "";
  }

  async function apiFetch(path, options = {}) {
    const headers = Object.assign({}, options.headers || {});
    if (accessToken) headers["Authorization"] = "Bearer " + accessToken;

    const response = await fetch(apiUrl(path), Object.assign({}, options, { headers }));
    let body = null;
    try { body = await response.json(); } catch (e) { /* пустое тело допустимо */ }

    if (!response.ok) {
      const message = (body && body.message) || `Ошибка запроса (${response.status})`;
      throw new Error(message);
    }
    return body;
  }

  // --- Экран авторизации -------------------------------------------------

  $("auth-toggle-btn").addEventListener("click", () => {
    isRegisterMode = !isRegisterMode;
    $("auth-submit").textContent = isRegisterMode ? "Зарегистрироваться" : "Войти";
    $("auth-toggle-text").textContent = isRegisterMode ? "Уже есть аккаунт?" : "Нет аккаунта?";
    $("auth-toggle-btn").textContent = isRegisterMode ? "Войти" : "Зарегистрироваться";
    hideError($("auth-error"));
  });

  $("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError($("auth-error"));
    const email = $("auth-email").value.trim();
    const password = $("auth-password").value;
    const submitBtn = $("auth-submit");
    submitBtn.disabled = true;

    try {
      if (isRegisterMode) {
        await apiFetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
      }
      const login = await apiFetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      accessToken = login.access_token;
      userEmail = email;
      enterAnalyzer();
    } catch (err) {
      showError($("auth-error"), err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  function enterAnalyzer() {
    $("auth-screen").style.display = "none";
    $("analyzer-screen").style.display = "block";
    $("account-email").textContent = userEmail || "";
  }

  $("logout-btn").addEventListener("click", () => {
    accessToken = null;
    userEmail = null;
    uploadedResumeId = null;
    $("analyzer-screen").style.display = "none";
    $("auth-screen").style.display = "block";
    $("auth-password").value = "";
  });

  // --- Экран анализа -------------------------------------------------------

  function updateAnalyzeAvailability() {
    const hasVacancy = $("vacancy-text").value.trim().length > 0;
    $("analyze-btn").disabled = !(hasVacancy && uploadedResumeId);
  }

  $("vacancy-text").addEventListener("input", updateAnalyzeAvailability);

  $("resume-file").addEventListener("change", async () => {
    const file = $("resume-file").files[0];
    if (!file) return;

    hideError($("analyze-error"));
    $("dropzone-label").textContent = "Загрузка резюме...";

    const formData = new FormData();
    formData.append("file", file);

    try {
      const resume = await apiFetch("/resume", { method: "POST", body: formData });
      uploadedResumeId = resume.id;
      $("dropzone").classList.add("has-file");
      $("dropzone-label").innerHTML = `<span class="filename">${file.name}</span> — распознано навыков: ${resume.skills.length}`;
    } catch (err) {
      uploadedResumeId = null;
      $("dropzone-label").textContent = "PDF или DOCX — нажмите, чтобы выбрать файл";
      showError($("analyze-error"), err.message);
    } finally {
      updateAnalyzeAvailability();
    }
  });

  $("analyze-btn").addEventListener("click", async () => {
    hideError($("analyze-error"));
    const btn = $("analyze-btn");
    btn.disabled = true;
    btn.textContent = "Анализируем...";

    try {
      const result = await apiFetch("/match", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ resume_id: uploadedResumeId, vacancy: $("vacancy-text").value.trim() }),
      });
      renderResults(result);
    } catch (err) {
      showError($("analyze-error"), err.message);
    } finally {
      btn.textContent = "Analyze";
      updateAnalyzeAvailability();
    }
  });

  function renderSkillList(el, items, mark, markClass) {
    el.innerHTML = "";
    if (items.length === 0) {
      const li = document.createElement("li");
      li.className = "empty-note";
      li.textContent = "—";
      el.appendChild(li);
      return;
    }
    for (const item of items) {
      const li = document.createElement("li");
      const markSpan = document.createElement("span");
      markSpan.className = "mark " + markClass;
      markSpan.textContent = mark;
      li.appendChild(markSpan);
      li.appendChild(document.createTextNode(item));
      el.appendChild(li);
    }
  }

  function renderResults(result) {
    $("input-panel").style.display = "none";
    $("results-screen").style.display = "block";

    $("score-number").textContent = result.match_percent + "%";
    renderSkillList($("matched-list"), result.matched_skills || [], "✓", "good");
    renderSkillList($("missing-list"), result.missing_skills || [], "✗", "bad");

    const recEl = $("recommendations-list");
    recEl.innerHTML = "";
    const recs = result.recommendations || [];
    if (recs.length === 0) {
      const li = document.createElement("li");
      li.textContent = "Нет отдельных рекомендаций — кандидат уже хорошо покрывает требования.";
      recEl.appendChild(li);
    } else {
      for (const rec of recs) {
        const li = document.createElement("li");
        li.textContent = rec;
        recEl.appendChild(li);
      }
    }

    $("summary-text").textContent = result.summary || "";
  }

  $("reset-btn").addEventListener("click", () => {
    $("results-screen").style.display = "none";
    $("input-panel").style.display = "block";
    $("vacancy-text").value = "";
    $("resume-file").value = "";
    uploadedResumeId = null;
    $("dropzone").classList.remove("has-file");
    $("dropzone-label").textContent = "PDF или DOCX — нажмите, чтобы выбрать файл";
    updateAnalyzeAvailability();
  });
})();
</script>
</body>
</html>
